description = "Define what to build — spec before code"

prompt = """
Invoke the `spec-driven-development` skill. First run `interview-me` until ~95% confidence: ask clarifying questions one at a time when intent/scope/acceptance/Jira type is ambiguous, list ASSUMPTIONS I'M MAKING, and record answers. Then read the accepted `intent/INTENT-<JIRAKEY>.md` + linked Jira issue + `CONSTRAINTS.md`, apply org skills (brand, security, compliance, UX) as constraints, write `docs/specs/SPEC-<JIRAKEY>.md` from `templates/spec/SPEC.md.example` covering the 6 areas (+ threat-model for auth/data/payment/API work) with testable criteria — every criterion gets an AC-ID mapped to ≥1 test (unmapped AC = spec not ready). Flag policy conflicts in Flagged concerns for owner sign-off, record intent SHA + skill versions + prompt in Provenance. Also run `constraint-driven-development` if `CONSTRAINTS.md` is missing. Stop for human approval before planning. No product code.
"""
